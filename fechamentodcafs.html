<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo de CAFs - Total Express</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tooltip-box {
            display: none;
            position: absolute;
            z-index: 50;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 300px;
            font-size: 12px;
            line-height: 1.4;
            border-left: 4px solid #e31b23;
        }
        .has-tooltip:hover .tooltip-box {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <!-- CABEÇALHO -->
    <header class="bg-[#0b1f3b] text-white shadow-md border-b-4 border-[#e31b23]">
        <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-[#e31b23] text-white font-black px-3 py-1.5 rounded text-lg tracking-wider">TEX</div>
                <div>
                    <h1 class="text-xl font-bold">Controlo Diário de CAFs</h1>
                    <p class="text-slate-300 text-xs">Gestão de Fechamento Operacional</p>
                </div>
            </div>
            <div class="mt-4 md:mt-0 bg-[#162f55] px-4 py-2 rounded-lg border border-slate-700 text-xs font-medium">
                <span id="current-date">Hoje: Carregando...</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">

        <!-- BLOCO DE IMPORTAÇÃO -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
            <h2 class="text-base font-bold text-slate-700 mb-1">📂 Carregar Planilha Diária</h2>
            <p class="text-xs text-slate-500 mb-4">Selecione o ficheiro Excel (.xlsx) descarregado do sistema.</p>
            <label class="inline-block cursor-pointer bg-[#e31b23] hover:bg-red-700 text-white font-semibold text-sm px-6 py-2.5 rounded-lg shadow transition">
                📁 Selecionar Ficheiro Excel
                <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFile(event)">
            </label>
            <div id="file-info" class="mt-3 text-xs font-semibold text-slate-600 hidden"></div>
        </section>

        <!-- CARTÕES DE RESUMO E FILTROS -->
        <section class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <button onclick="filterCards('all')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-left hover:bg-slate-50 transition border-l-4 border-l-[#0b1f3b]">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Total de CAFs</p>
                <p id="kpi-total" class="text-2xl font-bold text-[#0b1f3b] mt-1">0</p>
            </button>
            <button onclick="filterCards('hoje')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-left hover:bg-slate-50 transition border-l-4 border-l-emerald-500">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Abertas Hoje</p>
                <p id="kpi-hoje" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
            </button>
            <button onclick="filterCards('atencao')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-left hover:bg-slate-50 transition border-l-4 border-l-amber-500">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Dia Anterior / 2-3d</p>
                <p id="kpi-ontem" class="text-2xl font-bold text-amber-600 mt-1">0</p>
            </button>
            <button onclick="filterCards('criticas')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-left hover:bg-slate-50 transition border-l-4 border-l-[#e31b23]">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Encerrar (> 3 Dias)</p>
                <p id="kpi-criticas" class="text-2xl font-bold text-[#e31b23] mt-1">0</p>
            </button>
        </section>

        <!-- PESQUISA -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <input type="text" id="search-input" placeholder="Pesquisar por número de CAF ou motorista..." onkeyup="filterCardsBySearch()" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#0b1f3b]">
        </div>

        <!-- GRELHA DE CARTÕES -->
        <section id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border border-slate-200 text-sm">
                Aguardando carregamento da planilha...
            </div>
        </section>

    </main>

    <script>
        const todayObj = new Date();
        const hojeFmt = String(todayObj.getDate()).padStart(2, '0') + '/' + String(todayObj.getMonth() + 1).padStart(2, '0') + '/' + todayObj.getFullYear();
        document.getElementById('current-date').innerText = "Hoje: " + hojeFmt;

        let globalData = [];
        let currentFilter = 'all';
        let closedCafs = JSON.parse(localStorage.getItem('closedCafs') || '{}');

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
                    
                    if (json.length === 0) {
                        alert("O ficheiro está vazio.");
                        return;
                    }

                    globalData = json.map(row => {
                        return {
                            caf: row['CAF'] || '-',
                            agente: row['Agente'] || '-',
                            tipo: row['Tipo'] || '-',
                            dataAbertura: row['Data de Abertura'] || '',
                            hora: row['Hora'] || '-',
                            motorista: row['Nome do Motorista'] || '-',
                            cpf: row['CPF do Motorista'] || '-',
                            qtdeTotal: row['QTDE Total'] || 0,
                            entregues: row['Entregues/RMA/Reversa Executada'] || 0,
                            ncs: row["NC's Atualizadas"] || 0,
                            expresso: row['Expresso'] || 0,
                            superExpresso: row['Super Expresso'] || 0,
                            cards: row['Cards'] || 0,
                            goback: row['GoBack'] || 0,
                            rma: row['RMA'] || 0,
                            coletaReversa: row['Coleta Reversa'] || 0,
                            evolucao: row['Evolução'] || '0%',
                            dataEncerramento: row['Data Encerramento CAF'] || '-',
                            statusSistemico: row['Status'] || 'Em andamento'
                        };
                    }).filter(item => item.caf !== '-');

                    const infoEl = document.getElementById('file-info');
                    infoEl.innerText = `Ficheiro carregado com sucesso! (${globalData.length} CAFs encontradas)`;
                    infoEl.classList.remove('hidden');
                    infoEl.classList.add('text-emerald-600');

                    renderCards();
                } catch (err) {
                    console.error(err);
                    alert("Erro ao ler o ficheiro.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseDate(dateInput) {
            if (!dateInput) return null;
            if (dateInput instanceof Date) return dateInput;
            let str = dateInput.toString().trim();
            if (str.includes('-')) {
                let parts = str.split(' ')[0].split('-');
                if (parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]);
            } else if (str.includes('/')) {
                let parts = str.split('/');
                if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            return new Date(str);
        }

        function formatDateClean(dateInput) {
            if (!dateInput) return '-';
            if (dateInput instanceof Date && !isNaN(dateInput)) {
                let d = String(dateInput.getDate()).padStart(2, '0');
                let m = String(dateInput.getMonth() + 1).padStart(2, '0');
                let y = dateInput.getFullYear();
                return `${d}/${m}/${y}`;
            }
            let str = dateInput.toString().trim().split(' ')[0];
            if (str.includes('-')) {
                let parts = str.split('-');
                if (parts.length === 3) {
                    if (parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
            }
            return str;
        }

        function toggleCloseCaf(cafNumber, checkbox) {
            if (checkbox.checked) {
                closedCafs[cafNumber] = true;
            } else {
                delete closedCafs[cafNumber];
            }
            localStorage.setItem('closedCafs', JSON.stringify(closedCafs));
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            let countTotal = globalData.length;
            let countHoje = 0;
            let countOntem = 0;
            let countCriticas = 0;

            const now = new Date();
            now.setHours(0,0,0,0);

            globalData.forEach(item => {
                let isClosed = closedCafs[item.caf] || false;
                let d = parseDate(item.dataAbertura);
                let diffDays = 0;
                let category = 'hoje';
                let cardBorder = 'border-l-4 border-l-emerald-500 bg-white';
                let badgeHtml = `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded text-[11px] font-bold">🟢 Hoje</span>`;

                if (d && !isNaN(d.getTime())) {
                    d.setHours(0,0,0,0);
                    const diffTime = now - d;
                    diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                }

                if (diffDays <= 0) {
                    countHoje++;
                    category = 'hoje';
                } else if (diffDays === 1) {
                    countOntem++;
                    category = 'atencao';
                    cardBorder = 'border-l-4 border-l-amber-500 bg-amber-50/20';
                    badgeHtml = `<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-[11px] font-bold">🟡 Ontem</span>`;
                } else if (diffDays > 1 && diffDays <= 3) {
                    countOntem++;
                    category = 'atencao';
                    cardBorder = 'border-l-4 border-l-orange-500 bg-orange-50/20';
                    badgeHtml = `<span class="px-2 py-0.5 bg-orange-100 text-orange-800 rounded text-[11px] font-bold">🟠 ${diffDays} dias atrás</span>`;
                } else {
                    countCriticas++;
                    category = 'criticas';
                    cardBorder = 'border-l-4 border-l-[#e31b23] bg-red-50/40 shadow-sm';
                    badgeHtml = `<span class="px-2 py-0.5 bg-red-100 text-[#e31b23] rounded text-[11px] font-black animate-pulse">🔴 ENCERRAR (>3d)</span>`;
                }

                // Se o utilizador marcou o checkbox como fechado, sobrescreve o visual para verde claro de concluído
                if (isClosed) {
                    cardBorder = 'border-l-4 border-l-slate-400 bg-emerald-50/60 opacity-80';
                    badgeHtml = `<span class="px-2 py-0.5 bg-emerald-200 text-emerald-900 rounded text-[11px] font-bold">✅ Fechado pela Equipe</span>`;
                }

                let dataAberturaFmt = formatDateClean(item.dataAbertura);

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl shadow-sm border border-slate-200 transition hover:shadow-md relative ${cardBorder}`;
                card.setAttribute('data-category', category);
                card.setAttribute('data-search', `${item.caf} ${item.motorista}`.toLowerCase());

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <!-- CHECKBOX DE CONTROLO DE FECHO -->
                            <input type="checkbox" ${isClosed ? 'checked' : ''} onchange="toggleCloseCaf('${item.caf}', this)" class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500 cursor-pointer" title="Marcar como fechado">
                            
                            <!-- NÚMERO DA CAF COM TOOLTIP -->
                            <div class="relative has-tooltip cursor-pointer">
                                <span class="text-base font-bold text-[#0b1f3b] hover:underline">CAF: ${item.caf}</span>
                                <div class="tooltip-box">
                                    <p class="font-bold text-[#e31b23] mb-1">Detalhes da CAF ${item.caf}</p>
                                    <p><strong>Motorista:</strong> ${item.motorista}</p>
                                    <p><strong>Tipo:</strong> ${item.tipo}</p>
                                    <p><strong>Qtd Total:</strong> ${item.qtdeTotal} | <strong>Entregues:</strong> ${item.entregues}</p>
                                    <p><strong>Expresso:</strong> ${item.expresso} | <strong>Super Exp:</strong> ${item.superExpresso}</p>
                                    <p><strong>Cards:</strong> ${item.cards} | <strong>GoBack:</strong> ${item.goback}</p>
                                    <p><strong>Evolução:</strong> ${item.evolucao}</p>
                                </div>
                            </div>
                        </div>
                        <div>${badgeHtml}</div>
                    </div>
                    <div class="space-y-1 text-xs text-slate-600">
                        <p><strong>Abertura:</strong> ${dataAberturaFmt}</p>
                        <p><strong>Motorista:</strong> <span class="text-slate-800 font-medium">${item.motorista}</span></p>
                        <p><strong>Qtd Total:</strong> ${item.qtdeTotal} itens</p>
                        <p><strong>Status Sistema:</strong> <span class="font-bold text-slate-700">${item.statusSistemico}</span></p>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('kpi-total').innerText = countTotal;
            document.getElementById('kpi-hoje').innerText = countHoje;
            document.getElementById('kpi-ontem').innerText = countOntem;
            document.getElementById('kpi-criticas').innerText = countCriticas;

            filterCards(currentFilter);
        }

        function filterCards(category) {
            currentFilter = category;
            const cards = document.querySelectorAll('#cards-container > div');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterCardsBySearch() {
            const input = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('#cards-container > div');
            cards.forEach(card => {
                const searchText = card.getAttribute('data-search');
                if (searchText.includes(input)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
